# Publishes the NAS agent image to GitHub Container Registry for amd64 and arm64 (Synology's
# Plus models and its ARM "j"/value models). Runs only when a tag like agent-v0.1.0 is pushed.
#
# Tags: agent-v0.1.0 publishes 0.1.0 and 0.1 (before 1.0 a minor version may break things, so there
# is no "0"); from agent-v1.2.3 on, also 1. The compose files cf-dam hands out name AGENT_IMAGE_TAG
# (packages/api/src/routes/sources.ts), which must be one of these.
# GHCR makes a new package private: after the first publish, set cf-dam-agent to Public under the
# package's settings, or Synology can't pull it.
name: Agent image

on:
  push:
    tags: ['agent-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cf-dam-agent
          tags: |
            type=match,pattern=agent-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=agent-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=agent-v(\d+)\.\d+\.\d+,group=1,enable=${{ !startsWith(github.ref_name, 'agent-v0.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The same agent with ffmpeg, for video posters and contact sheets: tags 0.1.0-video, 0.1-video.
      - id: video
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cf-dam-agent
          flavor: suffix=-video
          tags: |
            type=match,pattern=agent-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=agent-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=agent-v(\d+)\.\d+\.\d+,group=1,enable=${{ !startsWith(github.ref_name, 'agent-v0.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/agent/Dockerfile
          build-args: VIDEO=1
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.video.outputs.tags }}
          labels: ${{ steps.video.outputs.labels }}
