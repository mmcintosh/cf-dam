name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # A real S3-compatible server (it checks SigV4) for the storage integration tests.
      s3:
        image: rustfs/rustfs:latest
        ports: ['9000:9000']
        env:
          RUSTFS_ACCESS_KEY: cfdamtest
          RUSTFS_SECRET_KEY: cfdamtestsecret123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_ACCESS_KEY: cfdamtest
          S3_TEST_SECRET_KEY: cfdamtestsecret123 # gitleaks:allow (throwaway CI container)
      - run: npm run build

  # The NAS agent's image builds on every push; it is published only from a release tag (agent.yml).
  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/agent/Dockerfile
          push: false
          tags: cf-dam-agent:ci

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
